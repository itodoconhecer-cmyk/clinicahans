services:
  db:
    image: postgres:16-alpine
    container_name: clinicahans-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: clinicahans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - clinicahans_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicahans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinicahans_pgdata:
