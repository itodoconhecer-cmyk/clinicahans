spring:
  application:
    name: clinicahans-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicahans}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
clinicahans:
  business-zone: ${BUSINESS_ZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:clinicahans}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  file:
    name: ${LOG_DIR:logs}/clinicahans.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:logs}/clinicahans.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB
      clean-history-on-start: false
  level:
    root: WARN
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
