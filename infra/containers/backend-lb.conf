log_format clinicahans_safe '$time_iso8601 component=backend-lb method=$request_method status=$status duration=$request_time correlation_id=$http_x_correlation_id upstream_status=$upstream_status';
upstream clinicahans_api {
    zone clinicahans_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
    keepalive 16;
}
server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout clinicahans_safe;
    location = /healthz { return 200 'ok'; }
    location /api/ {
        proxy_pass http://clinicahans_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
