# Usar com docker-compose.yml e docker-compose.localstack.yml.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/clinicahans
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_POOL_MAX: "10"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina a senha inicial do administrador}
      CORS_ALLOWED_ORIGINS: http://localhost:8090
      CLINICAHANS_DEMO_DATA_ENABLED: "false"
      # Enderecos reservados para integracoes futuras; ainda nao consumidos pela API.
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      # O JRE nao depende de curl: verificar readiness via porta pela ferramenta bash.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 12
  backend-lb:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./infra/containers/backend-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: infra/containers/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend-lb
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
