name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          find frontend -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Validate required frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f frontend/services/api.js
          test -f frontend/verify-architecture.mjs
      - name: Enforce vanilla architecture and REST client
        run: node frontend/verify-architecture.mjs
